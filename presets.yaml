# Reusable presets. EDIT or ADD presets in presets.local.yaml (same shape; merged over this file, survives updates).
# weights: how much each detected signal counts toward the highlight score.
# layout_mode: dynamic = automatic switching, or a fixed layout: split | gameplay_voice | game_audio | pip | circle | reaction
# pip_style (dynamic mode): square | circle  -> how the "facecam over gameplay" layout looks
# keywords_extra: {strong:[..], medium:[..]} added to the global keyword lists for this preset only
presets:
  gta6_cinematic:
    label: GTA 6 Cinematic Highlights
    group: Gaming - cinematic & story
    clip_len: [20, 60]
    weights: {voice: 0.5, game: 1.4, motion: 1.5, keywords: 0.4, scene: 0.8, dialogue: 0.1}
    layout_mode: dynamic
    pip_style: square
    effects: {zoom: 5, freeze: 1, memes: 0, sfx: true, transitions: true}
    caption_style: clean
  funny_moments:
    label: Funny Gaming Moments
    group: Gaming - funny & reactions
    clip_len: [15, 45]
    weights: {voice: 1.3, game: 0.8, motion: 0.4, keywords: 1.6, scene: 0.2, dialogue: 0.3}
    layout_mode: dynamic
    pip_style: circle
    effects: {zoom: 4, freeze: 1, memes: 2, sfx: true, transitions: true}
    caption_style: pop
  facecam_reactions:
    label: Facecam Reactions
    group: Gaming - funny & reactions
    clip_len: [15, 40]
    weights: {voice: 1.8, game: 0.9, motion: 0.3, keywords: 1.2, scene: 0.2, dialogue: 0.2}
    layout_mode: dynamic
    pip_style: circle
    bias_layout: reaction
    effects: {zoom: 4, freeze: 1, memes: 1, sfx: true, transitions: true}
    caption_style: pop
  gaming_commentary:
    label: Gaming Commentary
    group: Gaming - commentary
    clip_len: [30, 75]
    weights: {voice: 1.0, game: 0.3, motion: 0.2, keywords: 0.8, scene: 0.1, dialogue: 1.4}
    layout_mode: split
    effects: {zoom: 2, freeze: 0, memes: 0, sfx: false, transitions: false}
    caption_style: clean
  tech_tutorial:
    label: Tech Tutorials & Repo Demos
    group: Creators, talks & education
    clip_len: [25, 90]
    weights: {voice: 0.4, game: 0.1, motion: 0.5, keywords: 1.2, scene: 0.6, dialogue: 1.6}
    layout_mode: gameplay_voice        # screen recording full-frame; cropx follows on-screen activity
    effects: {zoom: 3, freeze: 0, memes: 0, sfx: false, transitions: true}
    caption_style: clean
    keywords_extra:
      strong: [error, bug, fixed, works, finally, deployed, deploy, shipped, install, build, benchmark, faster, slower, crash, token, agent, model, repo, commit, demo, result, wow]
      medium: [api, function, component, install, config, test, run, output, terminal, code, prompt, gpu, cpu, latency]
  viral_fast:
    label: Fast-paced Viral Shorts
    group: General - fast & viral
    clip_len: [15, 30]
    weights: {voice: 1.2, game: 1.0, motion: 0.5, keywords: 1.8, scene: 0.3, dialogue: 0.2}
    layout_mode: dynamic
    pip_style: circle
    effects: {zoom: 6, freeze: 2, memes: 4, sfx: true, transitions: true}
    caption_style: pop
  clean_pro:
